
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070811">
  <meta name="description" content="AIZO AI — savollar, g‘oyalar va yangi bilimlar uchun shaxsiy sun’iy intellekt yordamchisi.">
  <title>AIZO AI — Sun’iy intellekt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>✦ AIZO <span>AI</span></h2>

    <button id="newChat" type="button">＋ Yangi suhbat</button>

    <p>Shaxsiy sun’iy intellekting</p>
    <small>O‘rgan. Yarat. Kashf et.</small>
  </aside>

  <main>
    <header>
      <b>AIZO AI</b>
      <span>● AI interfeysi tayyor</span>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome">
        <div class="symbol">✦</div>
        <h1>Kelajakni <span>birga yaratamiz.</span></h1>
        <p>Istalgan savolingni yoz — birgalikda izlanamiz.</p>
      </div>
    </section>

    <form id="chatForm">
      <textarea
        id="message"
        placeholder="AIZO AI ga xabar yoz..."
        aria-label="Xabaringiz"
        rows="1"
        required
      ></textarea>

      <button type="submit" aria-label="Xabarni yuborish">➤</button>
    </form>

    <footer>
      AIZO AI — yangi g‘oyalar sari.
      AI javoblarini muhim holatlarda tekshiring.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
